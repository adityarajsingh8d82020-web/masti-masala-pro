
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171326">
<title>Masti Masala Pro</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100e19;color:#fff;font-family:Arial,sans-serif}
header{background:#211a36;padding:18px;font-size:25px;font-weight:bold}
header span{color:#ff70bb}
main{max-width:600px;margin:auto;padding:16px}
.card{background:#201c30;border:1px solid #39314d;border-radius:18px;padding:18px;margin:14px 0}
h2{font-size:22px;margin-top:4px}
input,textarea,button{width:100%;padding:14px;margin:7px 0;border-radius:12px;border:1px solid #49405e;font-size:16px}
input,textarea{background:#151220;color:white}
button{background:#ff70bb;color:#241027;font-weight:bold;border:0;cursor:pointer}
button.secondary{background:#39314d;color:white}
button:disabled{opacity:.5}
.small{font-size:14px;color:#c2bbd2}
#status{padding:10px;color:#ffb5da;overflow-wrap:anywhere}
.user{display:flex;align-items:center;gap:10px}
.avatar{width:44px;height:44px;flex-shrink:0;border-radius:50%;background:#ff70bb;color:#241027;display:grid;place-items:center;font-weight:bold}
.user button{width:auto;margin-left:auto}
#videoStage{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}#videoStage video{width:100%;min-height:120px;background:#08070d;border-radius:12px;object-fit:cover}#callControls{display:flex;gap:8px;flex-wrap:wrap}#callControls button{flex:1;min-width:110px}#messages{height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.msg{background:#39314d;padding:10px 12px;border-radius:12px;max-width:85%;overflow-wrap:anywhere}
.msg.mine{align-self:flex-end;background:#a84c88}
.hidden{display:none!important}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1;min-width:0}
.row button{width:auto;min-width:78px}
</style>
</head>
<body>
<header>🌶️ Masti <span>Masala Pro</span></header>
<main>
<div id="status">App loading...</div>

<section id="auth" class="card hidden">
<h2>Welcome to Masti Masala</h2>
<p class="small">Create an account or sign in.</p>
<input id="email" type="email" placeholder="Email address" autocomplete="email">
<input id="password" type="password" placeholder="Password (minimum 6 characters)" autocomplete="current-password">
<button id="signup">Create Account</button>
<button id="login" class="secondary">Sign In</button>
</section>

<section id="app" class="hidden">
<div class="card">
<h2>Your Profile</h2>
<input id="displayName" maxlength="40" placeholder="Your display name">
<textarea id="bio" maxlength="120" placeholder="About you (max 120 characters)"></textarea>
<button id="saveProfile">Save Profile</button>
<button id="logout" class="secondary">Sign Out</button>
</div>

<div class="card">
<h2>People</h2>
<p class="small">Select another registered account to start a chat.</p>
<div id="people">Loading profiles...</div>
</div>

<div class="card">
<h2>Your Chats</h2>
<div id="chatList">No chats yet.</div>
</div>

<div id="chatBox" class="card hidden">
<h2 id="chatTitle">Chat</h2>
<div id="callControls"><button id="startCall" type="button">📹 Video Call</button><button id="acceptCall" class="secondary hidden" type="button">Answer Call</button><button id="endCall" class="secondary hidden" type="button">End Call</button></div>
<div id="videoStage" class="hidden"><video id="remoteVideo" autoplay playsinline></video><video id="localVideo" autoplay muted playsinline></video></div>
<div id="messages"></div>
<form id="messageForm" class="row">
<input id="messageInput" maxlength="1000" placeholder="Write a message..." autocomplete="off" required>
<button type="submit">Send</button>
</form>
<button id="closeChat" class="secondary">Close Chat</button>
</div>
</section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

import {
 getAuth, createUserWithEmailAndPassword,
 signInWithEmailAndPassword, onAuthStateChanged,
 signOut, updateProfile
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

import {
 getFirestore, doc, getDoc, setDoc,
 collection, query, where, onSnapshot,
 addDoc, updateDoc, serverTimestamp, orderBy
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);

let currentUser = null;
let peopleUnsub = null;
let chatsUnsub = null;
let messagesUnsub = null;
let incomingCallsUnsub = null;
let callDocUnsub = null;
let candidateUnsub = null;
let peer = null;
let localStream = null;
let activeCallRef = null;
let activeCallRole = null;
let remoteDescriptionSet = false;
let pendingRemoteCandidates = [];
let activeChatId = null;
let activeOther = null;
let busy = false;

function status(text) {
 $("status").textContent = text;
}

function show(id, yes) {
 $(id).classList.toggle("hidden", !yes);
}

function chatIdFor(a,b) {
 return [a,b].sort().join("__");
}

function stopListeners() {
 if (peopleUnsub) peopleUnsub();
 if (chatsUnsub) chatsUnsub();
 if (messagesUnsub) messagesUnsub();
 if (incomingCallsUnsub) incomingCallsUnsub();
 if (callDocUnsub) callDocUnsub();
 if (candidateUnsub) candidateUnsub();
 incomingCallsUnsub = null;
 callDocUnsub = null;
 candidateUnsub = null;

 peopleUnsub = null;
 chatsUnsub = null;
 messagesUnsub = null;
}

function closeChat() {
 if (messagesUnsub) messagesUnsub();
 if (incomingCallsUnsub) incomingCallsUnsub();
 incomingCallsUnsub = null;
 endVideoCall(false);
 messagesUnsub = null;
 activeChatId = null;
 activeOther = null;
 $("messages").replaceChildren();
 show("chatBox",false);
}


function showCallStage(yes) {
 $("videoStage").classList.toggle("hidden", !yes);
 $("endCall").classList.toggle("hidden", !yes);
 $("startCall").classList.toggle("hidden", yes);
}

function stopCandidateListener() {
 if (candidateUnsub) candidateUnsub();
 candidateUnsub = null;
}

async function endVideoCall(updateServer = true) {
 const oldRef = activeCallRef;
 if (callDocUnsub) callDocUnsub();
 callDocUnsub = null;
 stopCandidateListener();
 if (peer) {
  peer.ontrack = null;
  peer.onicecandidate = null;
  peer.close();
 }
 peer = null;
 if (localStream) localStream.getTracks().forEach(track => track.stop());
 localStream = null;
 $("localVideo").srcObject = null;
 $("remoteVideo").srcObject = null;
 showCallStage(false);
 activeCallRef = null;
 activeCallRole = null;
 remoteDescriptionSet = false;
 pendingRemoteCandidates = [];
 if (updateServer && oldRef) {
  try { await updateDoc(oldRef,{status:"ended",endedAt:serverTimestamp()}); }
  catch(e) { console.warn("Call end update:",e.message); }
 }
}

async function preparePeer(callRef, role) {
 peer = new RTCPeerConnection({
  iceServers:[{urls:"stun:stun.l.google.com:19302"}]
 });
 activeCallRef = callRef;
 activeCallRole = role;

 // If another app is using the microphone, continue with video-only.
 try {
  localStream = await navigator.mediaDevices.getUserMedia({audio:true,video:true});
 } catch(audioVideoError) {
  try {
   localStream = await navigator.mediaDevices.getUserMedia({audio:false,video:true});
   status("Camera ready. Microphone busy/blocked, so call will be video-only.");
  } catch(videoError) {
   peer.close();
   peer = null;
   throw new Error("Camera unavailable. Close Instagram/other camera apps and allow camera permission.");
  }
 }
 $("localVideo").srcObject = localStream;
 localStream.getTracks().forEach(track => peer.addTrack(track,localStream));
 peer.ontrack = event => {
  const remoteVideo = $("remoteVideo");
  let incomingStream = event.streams && event.streams[0];
  if (!incomingStream) {
   incomingStream = remoteVideo.srcObject instanceof MediaStream
    ? remoteVideo.srcObject
    : new MediaStream();
   if (!incomingStream.getTracks().some(track => track.id === event.track.id)) {
    incomingStream.addTrack(event.track);
   }
  }
  remoteVideo.srcObject = incomingStream;
  remoteVideo.playsInline = true;
  remoteVideo.autoplay = true;
  showCallStage(true);
  event.track.onunmute = () => {
   remoteVideo.play().catch(() => {});
   status(event.track.kind === "video" ? "Remote video track active." : "Remote audio track active.");
  };
  remoteVideo.play().then(() => {
   status("Remote media received. Waiting for video frame...");
  }).catch(() => {
   status("Remote video received. Tap the video once if playback is blocked.");
  });
  remoteVideo.onloadeddata = () => {
   status("Remote video frame received.");
  };
 };
 peer.onconnectionstatechange = () => {
  if (!peer) return;
  const state = peer.connectionState;
  if (state === "connected") status("Video call connected.");
  else if (state === "connecting") status("Connecting video...");
  else if (state === "failed") status("Video connection failed. Network may need TURN relay.");
  else if (state === "disconnected") status("Video connection interrupted. Checking network...");
 };
 peer.onicecandidate = async event => {
  if (!event.candidate || !activeCallRef) return;
  const side = activeCallRole === "caller" ? "callerCandidates" : "calleeCandidates";
  try {
   await addDoc(collection(db,"chats",activeChatId,"calls",activeCallRef.id,side),event.candidate.toJSON());
  } catch(e) { status("Video call ICE error: " + e.message); }
 };
 showCallStage(true);
}

async function flushPendingRemoteCandidates() {
 if (!peer || !remoteDescriptionSet) return;
 const queued = pendingRemoteCandidates.splice(0);
 for (const candidate of queued) {
  try { await peer.addIceCandidate(new RTCIceCandidate(candidate)); }
  catch(e) { console.warn("Queued ICE candidate:",e.message); }
 }
}

function watchRemoteCandidates(callRef, remoteSide) {
 stopCandidateListener();
 candidateUnsub = onSnapshot(collection(db,"chats",activeChatId,"calls",callRef.id,remoteSide),snap => {
  snap.docChanges().forEach(async change => {
   if (change.type !== "added" || !peer) return;
   const candidate = change.doc.data();
   if (!remoteDescriptionSet) {
    pendingRemoteCandidates.push(candidate);
    return;
   }
   try { await peer.addIceCandidate(new RTCIceCandidate(candidate)); }
   catch(e) { console.warn("ICE candidate:",e.message); }
  });
 },err => status("Video connection error: " + err.message));
}

async function startVideoCall() {
 if (!currentUser || !activeChatId || !activeOther || peer) return;
 if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
  return status("Video call ke liye browser permission aur HTTPS zaroori hai.");
 }
 try {
  status("Camera/microphone permission allow karo...");
  const ref = doc(collection(db,"chats",activeChatId,"calls"));
  await setDoc(ref,{callerId:currentUser.uid,calleeId:activeOther.uid,participants:[currentUser.uid,activeOther.uid],status:"preparing",createdAt:serverTimestamp()});
  await preparePeer(ref,"caller");
  const offer = await peer.createOffer();
  await peer.setLocalDescription(offer);
  await updateDoc(ref,{offer:{type:offer.type,sdp:offer.sdp},status:"ringing"});
  $("acceptCall").classList.add("hidden");
  callDocUnsub = onSnapshot(ref,async snap => {
   if (!snap.exists()) return;
   const data = snap.data();
   if (data.status === "ended" || data.status === "rejected") {
    await endVideoCall(false);
    status("Video call ended.");
    return;
   }
   if (data.answer && peer && !remoteDescriptionSet) {
    try {
     await peer.setRemoteDescription(new RTCSessionDescription(data.answer));
     remoteDescriptionSet = true;
     await flushPendingRemoteCandidates();
     watchRemoteCandidates(ref,"calleeCandidates");
     status("Video call connected.");
   } catch(e) { status("Answer error: " + e.message); }
   }
  },err => status("Call signal error: " + err.message));
  watchIncomingCalls();
  status("Calling " + activeOther.name + "... Doosre user ko chat kholkar Answer Call dabana hoga.");
 } catch(e) {
  await endVideoCall(false);
  status("Video call start error: " + e.message);
 }
}

async function answerVideoCall(callId) {
 if (!currentUser || !activeChatId) {
  status("Pehle chat open karo, phir call answer karo.");
  return;
 }
 if (peer) {
  status("Is phone par pehle se call active hai. End Call dabakar dobara try karo.");
  return;
 }
 if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
  return status("Video call ke liye browser permission aur HTTPS zaroori hai.");
 }
 const answerButton = $("acceptCall");
 answerButton.disabled = true;
 status("Answer button dabaya gaya. Call details check ho rahi hain...");
 try {
  const ref = doc(db,"chats",activeChatId,"calls",callId);
  const snap = await getDoc(ref);
  if (!snap.exists()) throw new Error("Call ab available nahi hai.");
  const data = snap.data();
  if (data.calleeId !== currentUser.uid || !data.offer) throw new Error("Ye call tumhare liye nahi hai.");
  status("Camera/microphone permission allow karo...");
  await preparePeer(ref,"callee");
  await peer.setRemoteDescription(new RTCSessionDescription(data.offer));
  remoteDescriptionSet = true;
  await flushPendingRemoteCandidates();
  watchRemoteCandidates(ref,"callerCandidates");
  const answer = await peer.createAnswer();
  await peer.setLocalDescription(answer);
  await updateDoc(ref,{answer:{type:answer.type,sdp:answer.sdp},status:"active"});
  $("acceptCall").classList.add("hidden");
  status("Video call connected.");
 } catch(e) {
  await endVideoCall(false);
  status("Answer call error: " + e.message);
 } finally {
  answerButton.disabled = false;
 }
}

function watchIncomingCalls() {
 if (incomingCallsUnsub || !activeChatId || !currentUser) return;
 incomingCallsUnsub = onSnapshot(collection(db,"chats",activeChatId,"calls"),snap => {
  const incoming = snap.docs.find(d => {
   const x = d.data();
   return x.calleeId === currentUser.uid && x.status === "ringing";
  });
  if (incoming && !peer) {
   $("acceptCall").classList.remove("hidden");
   $("acceptCall").textContent = "📞 Answer Incoming Call";
   $("acceptCall").onclick = () => answerVideoCall(incoming.id);
   status("Incoming video call! Answer Call dabao.");
  } else if (!peer) {
   $("acceptCall").classList.add("hidden");
  }
 },err => status("Incoming call error: " + err.message));
}

function makeUserRow(profile, uid) {
 const wrap = document.createElement("div");
 wrap.className = "card user";

 const avatar = document.createElement("div");
 avatar.className = "avatar";
 avatar.textContent = (profile.displayName || "?").slice(0,1).toUpperCase();

 const details = document.createElement("div");
 details.style.flex = "1";

 const name = document.createElement("strong");
 name.textContent = profile.displayName || "Member";

 const bio = document.createElement("div");
 bio.className = "small";
 bio.textContent = profile.bio || "Masti Masala member";

 details.append(name,bio);

 const button = document.createElement("button");
 button.textContent = "Chat";
 button.addEventListener("click", () => {
  openChat(uid, profile.displayName || "Member");
 });

 wrap.append(avatar,details,button);
 return wrap;
}

function makeChatRow(chat) {
 const otherUid = chat.participants.find(id => id !== currentUser.uid);
 if (!otherUid) return null;

 const wrap = document.createElement("div");
 wrap.className = "card user";

 const details = document.createElement("div");
 details.style.flex = "1";

 const name = document.createElement("strong");
 name.textContent = chat.otherName || "Chat member";

 const last = document.createElement("div");
 last.className = "small";
 last.textContent = chat.lastMessage || "Start chatting";

 details.append(name,last);

 const button = document.createElement("button");
 button.textContent = "Open";
 button.addEventListener("click", () => {
  openChat(otherUid,chat.otherName || "Chat member");
 });

 wrap.append(details,button);
 return wrap;
}

function loadPeople() {
 if (peopleUnsub) peopleUnsub();

 peopleUnsub = onSnapshot(
  collection(db,"publicProfiles"),
  snap => {
   const root = $("people");
   root.replaceChildren();
   let count = 0;

   snap.forEach(item => {
    if (item.id === currentUser.uid) return;
    root.appendChild(makeUserRow(item.data(),item.id));
    count++;
   });

   if (!count) {
    root.textContent =
     "Abhi koi doosra account nahi mila. Doosre account se sign in karke profile save karo.";
   }
  },
  err => status("Profiles load error: " + err.message)
 );
}

function loadChats() {
 if (chatsUnsub) chatsUnsub();

 const q = query(
  collection(db,"chats"),
  where("participants","array-contains",currentUser.uid)
 );

 chatsUnsub = onSnapshot(q, async snap => {
  const root = $("chatList");
  root.replaceChildren();

  if (snap.empty) {
   root.textContent = "Abhi koi chat nahi hai. People mein kisi account ko select karo.";
   return;
  }

  for (const item of snap.docs) {
   const data = item.data();
   const otherUid = (data.participants || [])
    .find(id => id !== currentUser.uid);

   if (!otherUid) continue;

   let name = "Member";

   try {
    const p = await getDoc(doc(db,"publicProfiles",otherUid));
    if (p.exists()) name = p.data().displayName || name;
   } catch(e) {
    console.warn("Profile lookup:",e.message);
   }

   const row = makeChatRow({...data,otherName:name});
   if (row) root.appendChild(row);
  }
 }, err => status("Chats load error: " + err.message));
}

async function syncPublicProfile() {
 const ref = doc(db,"publicProfiles",currentUser.uid);
 const privateRef = doc(db,"users",currentUser.uid);

 const privateSnap = await getDoc(privateRef);
 const existing = await getDoc(ref);

 const name = currentUser.displayName ||
  (privateSnap.exists() && privateSnap.data().displayName) ||
  (existing.exists() && existing.data().displayName) || "Member";

 const bio = (privateSnap.exists() && privateSnap.data().bio) ||
  (existing.exists() && existing.data().bio) || "";

 $("displayName").value = name;
 $("bio").value = bio;

 await setDoc(ref,{
  displayName:name.slice(0,40),
  bio:String(bio).slice(0,120),
  updatedAt:serverTimestamp()
 });
}

async function saveProfile() {
 if (!currentUser) return;

 const name = $("displayName").value.trim();
 const bio = $("bio").value.trim();

 if (!name) return status("Display name likho.");

 try {
  await updateProfile(currentUser,{displayName:name});

  await setDoc(doc(db,"users",currentUser.uid),{
   displayName:name,
   bio,
   email:currentUser.email || "",
   updatedAt:serverTimestamp()
  },{merge:true});

  await setDoc(doc(db,"publicProfiles",currentUser.uid),{
   displayName:name,
   bio,
   updatedAt:serverTimestamp()
  });

  status("Profile save ho gayi!");
 } catch(e) {
  status("Profile save error: " + e.message);
 }
}

async function openChat(otherUid,otherName) {
 if (!currentUser || otherUid === currentUser.uid) return;

 closeChat();

 try {
  const id = chatIdFor(currentUser.uid,otherUid);
  const ref = doc(db,"chats",id);

  // Existing chat ko overwrite nahi karna.
  const existing = await getDoc(ref);

  if (!existing.exists()) {
   const participants = [currentUser.uid,otherUid].sort();

   await setDoc(ref,{
    participants,
    lastMessage:"",
    lastMessageAt:serverTimestamp(),
    updatedAt:serverTimestamp()
   });
  } else {
   const data = existing.data();

   if (
    !Array.isArray(data.participants) ||
    !data.participants.includes(currentUser.uid) ||
    !data.participants.includes(otherUid)
   ) {
    throw new Error("Chat participants match nahi kar rahe.");
   }
  }

  activeChatId = id;
  activeOther = {uid:otherUid,name:otherName};

  $("chatTitle").textContent = "Chat with " + otherName;
  show("chatBox",true);

  const mq = query(
   collection(db,"chats",id,"messages"),
   orderBy("createdAt","asc")
  );

  messagesUnsub = onSnapshot(mq,snap => {
   const root = $("messages");
   root.replaceChildren();

   snap.forEach(item => {
    const m = item.data();
    const bubble = document.createElement("div");

    bubble.className =
     "msg" + (m.senderId === currentUser.uid ? " mine" : "");

    bubble.textContent = m.text || "";
    root.appendChild(bubble);
   });

   root.scrollTop = root.scrollHeight;
  },err => {
   status("Messages error: " + err.message);
  });

  watchIncomingCalls();
  $("startCall").onclick = startVideoCall;
  $("endCall").onclick = () => endVideoCall(true);
  $("messageInput").focus();

 } catch(e) {
  closeChat();
  status("Chat open error: " + e.message);
 }
}

$("signup").addEventListener("click",async () => {
 if (busy) return;

 const email = $("email").value.trim();
 const password = $("password").value;

 if (!email || password.length < 6) {
  return status("Email aur minimum 6-character password daalo.");
 }

 busy = true;

 try {
  await createUserWithEmailAndPassword(auth,email,password);
  status("Account created!");
 } catch(e) {
  status("Sign-up error: " + e.message);
 } finally {
  busy = false;
 }
});

$("login").addEventListener("click",async () => {
 if (busy) return;

 busy = true;

 try {
  await signInWithEmailAndPassword(
   auth,$("email").value.trim(),$("password").value
  );
  status("Signed in!");
 } catch(e) {
  status("Login error: " + e.message);
 } finally {
  busy = false;
 }
});

$("saveProfile").addEventListener("click",saveProfile);
$("logout").addEventListener("click",() => signOut(auth));
$("closeChat").addEventListener("click",closeChat);

$("messageForm").addEventListener("submit",async e => {
 e.preventDefault();

 if (!currentUser || !activeChatId || !activeOther) return;

 const text = $("messageInput").value.trim();
 if (!text) return;

 const button = $("messageForm").querySelector("button");
 button.disabled = true;

 try {
  const chatRef = doc(db,"chats",activeChatId);
  const chatSnap = await getDoc(chatRef);

  if (!chatSnap.exists()) {
   throw new Error("Chat nahi mila. Dobara open karo.");
  }

  const participants = chatSnap.data().participants || [];

  if (
   !participants.includes(currentUser.uid) ||
   !participants.includes(activeOther.uid)
  ) {
   throw new Error("Is chat ko access karne ki permission nahi hai.");
  }

  await addDoc(collection(db,"chats",activeChatId,"messages"),{
   senderId:currentUser.uid,
   text,
   createdAt:serverTimestamp()
  });

  await updateDoc(chatRef,{
   lastMessage:text,
   lastMessageAt:serverTimestamp(),
   updatedAt:serverTimestamp()
  });

  $("messageInput").value = "";
 } catch(e) {
  status("Message send error: " + e.message);
 } finally {
  button.disabled = false;
 }
});

onAuthStateChanged(auth,async user => {
 stopListeners();
 closeChat();

 currentUser = user;

 show("auth",!user);
 show("app",!!user);

 if (!user) {
  status("Sign in ya account create karo.");
  return;
 }

 try {
  status("Profile load ho raha hai...");
  await syncPublicProfile();
  loadPeople();
  loadChats();
  status("Welcome, " + (user.displayName || user.email) + "!");
 } catch(e) {
  status("Account setup error: " + e.message);
 }
});
</script>
</body>
</html>
